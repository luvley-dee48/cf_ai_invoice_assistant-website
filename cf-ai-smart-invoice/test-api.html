<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    
    <div>
        <h2>Register</h2>
        <form id="registerForm">
            <input type="email" id="regEmail" placeholder="Email" required><br><br>
            <input type="password" id="regPassword" placeholder="Password" required><br><br>
            <input type="text" id="regName" placeholder="Name" required><br><br>
            <button type="submit">Register</button>
        </form>
    </div>
    
    <div>
        <h2>Login</h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required><br><br>
            <input type="password" id="loginPassword" placeholder="Password" required><br><br>
            <button type="submit">Login</button>
        </form>
    </div>
    
    <div id="result"></div>

    <script>
        const API_URL = 'http://localhost:8787';
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const name = document.getElementById('regName').value;
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password, name })
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
                
                if (response.ok) {
                    localStorage.setItem('auth_token', result.token);
                    localStorage.setItem('auth_user', JSON.stringify(result.user));
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        });
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                console.log('Attempting login with:', { email, password: '***' });
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                console.log('Login response:', { status: response.status, result });
                document.getElementById('result').innerHTML = `<pre>Status: ${response.status}\n${JSON.stringify(result, null, 2)}</pre>`;
                
                if (response.ok) {
                    localStorage.setItem('auth_token', result.token);
                    localStorage.setItem('auth_user', JSON.stringify(result.user));
                    console.log('Stored auth data:', { token: result.token.substring(0, 20) + '...', user: result.user });
                    
                    // Test the token by calling a protected endpoint
                    setTimeout(async () => {
                        try {
                            const token = localStorage.getItem('auth_token');
                            console.log('Testing protected endpoint with token:', token ? token.substring(0, 20) + '...' : 'null');
                            
                            const testResponse = await fetch(`${API_URL}/user/profile`, {
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json',
                                }
                            });
                            
                            const testResult = await testResponse.json();
                            console.log('Protected endpoint test:', { status: testResponse.status, result: testResult });
                            document.getElementById('result').innerHTML += `\n\nProtected endpoint test:\nStatus: ${testResponse.status}\n${JSON.stringify(testResult, null, 2)}`;
                        } catch (error) {
                            console.error('Protected endpoint test failed:', error);
                            document.getElementById('result').innerHTML += `\n\nProtected endpoint test failed: ${error.message}`;
                        }
                    }, 1000);
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
